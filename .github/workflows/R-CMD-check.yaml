on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

name: R-CMD-check

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          # Pinned rather than ubuntu-latest: that label moves to Ubuntu 26 on
          # 19 October 2026, and the runner image should change when we choose
          # it, not in the middle of a release.
          - {os: ubuntu-24.04,   r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-24.04,   r: 'release'}
          - {os: ubuntu-24.04,   r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          args: 'c("--no-manual", "--as-cran")'

      # Job logs are only visible to signed-in users; annotations show on the
      # run summary for anyone. On failure, post the tail of the check log and
      # of any failed test output there, so the error is readable at a glance.
      - name: Show check failures on the run summary
        if: failure()
        shell: bash
        run: |
          escape() { tr -d '\r' | sed -e 's/%/%25/g' | awk 'BEGIN { ORS = "%0A" } { print }'; }
          find check -type f \( -name '00check.log' -o -name '00install.out' -o -name '*.Rout.fail' \) 2>/dev/null |
            while read -r f; do
              echo "::error title=${{ matrix.config.os }} (${{ matrix.config.r }}) ${f#check/}::$(tail -n 150 "$f" | escape)"
            done
